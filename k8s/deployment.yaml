apiVersion: apps/v1
kind: Deployment
metadata:
  name: legobuilder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legobuilder
  template:
    metadata:
      labels:
        app: legobuilder
    spec:
      containers:
        - name: legobuilder
          image: legobuilder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: legobuilder
spec:
  type: NodePort
  selector:
    app: legobuilder
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30500
