# Tech Stack Configuration — LegoBuilder
#
# This file defines the TECHNOLOGY CHOICES for the LegoBuilder project.
# It maps to the components defined in docs/NOTIONAL_ARCHITECTURE.md.
#
# Document Relationships:
#   docs/PRD.md                    → WHAT to build (requirements)
#   docs/NOTIONAL_ARCHITECTURE.md  → WHAT structure (logical design)
#   docs/tech_stack.yaml (this)    → WHICH technologies (framework choices)
#   docs/TECHNICAL_ARCHITECTURE.md → HOW to implement (technical details)
#
# LegoBuilder is a CLIENT-ONLY SPA — no backend server, no external APIs.
# The entire application runs in the browser.

# =============================================================================
# PROJECT METADATA
# =============================================================================
project:
  name: "LegoBuilder"
  version: "0.1.0"
  description: "Browser-based 3D LEGO building application with snap-to-grid placement, undo/redo, and local persistence"
  type: "client-only-spa"

# =============================================================================
# BACKEND STACK
# =============================================================================
# LegoBuilder has NO backend. This section is intentionally minimal.
backend:
  enabled: false
  rationale: "Client-only SPA — all logic runs in the browser, data persists in IndexedDB"

# =============================================================================
# FRONTEND STACK
# =============================================================================
frontend:
  # Primary language
  language:
    name: "TypeScript"
    version: "5.x"
    rationale: "Type safety for complex 3D state management; catches geometry/math errors at compile time"

  # Framework
  framework:
    name: "React"
    version: "18.x"
    rationale: "Component-based architecture; excellent ecosystem for 3D (react-three/fiber); concurrent rendering for smooth UI"

  # Build tool
  build_tool:
    name: "Vite"
    version: "5.x"
    rationale: "Fast HMR for development; optimized production builds with tree-shaking; native ESM support"

  # 3D rendering library
  3d_library:
    name: "Three.js via @react-three/fiber"
    three_version: "0.160.x"
    r3f_version: "8.x"
    drei_version: "9.x"  # @react-three/drei for helpers
    rationale: "React-idiomatic 3D rendering; declarative scene graph; automatic disposal and reconciliation"

  # Performance libraries
  performance:
    bvh_library: "three-mesh-bvh"
    rationale: "BVH-accelerated raycasting for O(log n) mouse-to-brick intersection; critical for ghost preview at 500 bricks"

  # UI Component library
  ui_library:
    name: "Tailwind CSS"
    version: "3.x"
    rationale: "Utility-first CSS; rapid UI development; small production bundle with purging; PRD specifies Tailwind"

  # State management
  state_management:
    name: "Zustand"
    version: "4.x"
    middleware: "Immer"
    rationale: "Lightweight (1KB); immutable updates via Immer; no boilerplate; PRD specifies Zustand + Immer"

  # Package manager
  package_manager:
    name: "npm"
    rationale: "Universal availability; lockfile for reproducible builds; no additional tooling required"

  # Testing
  testing:
    unit: "Vitest"
    component: "React Testing Library"
    e2e: "Playwright"
    rationale: "Vitest is Vite-native (shared config, fast); RTL for component behavior testing; Playwright for E2E browser testing"

  # Linting
  linter:
    name: "ESLint"
    version: "8.x"
    formatter: "Prettier"
    rationale: "Industry standard for TypeScript/React; Prettier for consistent formatting"

  # Type checking
  type_checker:
    name: "TypeScript compiler (tsc)"
    strict_mode: true
    rationale: "Built-in type checking; strict mode catches null/undefined errors in 3D math"

# =============================================================================
# DATABASE & STORAGE
# =============================================================================
# LegoBuilder uses browser-native storage only — no server databases.
database:
  primary:
    type: "IndexedDB"
    wrapper: "idb"
    idb_version: "8.x"
    rationale: "Browser-native async storage; large quota (GB+); structured data support; idb wrapper provides Promise-based API; PRD specifies IndexedDB via idb"

  # No vector database, cache, object storage, or messaging needed
  vector:
    type: "none"
  cache:
    type: "none"
    rationale: "In-memory state via Zustand serves as the cache; no external cache needed"
  object_storage:
    type: "none"
  messaging:
    enabled: false
    rationale: "Client-only app with no inter-service communication"

# =============================================================================
# LLM & AI SERVICES
# =============================================================================
# LegoBuilder has NO AI/LLM features.
llm:
  enabled: false
  rationale: "All components are deterministic; no AI/ML features in MVP"

# =============================================================================
# AGENTIC WORKFLOWS
# =============================================================================
# LegoBuilder has NO agentic features.
agentic_workflows:
  enabled: false
  rationale: "Pure deterministic application; no AI agents or workflows"

# =============================================================================
# VOICE & COMMUNICATION
# =============================================================================
voice_communication:
  enabled: false
  rationale: "No voice or real-time communication features"

# =============================================================================
# CUSTOMER SUPPORT
# =============================================================================
customer_support:
  enabled: false
  rationale: "MVP is a standalone tool; no customer support features"

# =============================================================================
# ENTERPRISE PRODUCT INTELLIGENCE
# =============================================================================
product_intelligence:
  enabled: false
  rationale: "Standalone product; not part of a multi-product organization"

# =============================================================================
# INFRASTRUCTURE & DEPLOYMENT
# =============================================================================
infrastructure:
  # Deployment target
  deployment:
    type: "static-site"
    rationale: "Client-only SPA; no server needed; deploy as static files"

  # Container runtime (for Docker/KIND deployment per Spectra default)
  container:
    runtime: "Docker"
    orchestration: "KIND"
    node_port: 30500
    rationale: "Spectra default deployment target; nginx serves static build in production container"

  # CI/CD
  ci_cd:
    platform: "GitHub Actions"
    rationale: "Native GitHub integration; free for public repos; excellent ecosystem"

  # No cloud provider needed for MVP (static hosting)
  cloud:
    provider: "none"
    rationale: "MVP deploys to Docker/KIND; cloud hosting is a future consideration"

  # No IaC needed for MVP
  iac:
    tool: "none"
    rationale: "Docker/KIND deployment; no cloud infrastructure to manage"

  # No secrets management needed
  secrets:
    tool: "none"
    rationale: "Client-only app with no API keys or server secrets"

# =============================================================================
# OBSERVABILITY & MONITORING
# =============================================================================
# Client-side observability only
observability:
  logging:
    platform: "Browser Console (structured)"
    structured: true
    rationale: "Client-only app; structured console logging for development and debugging"

  metrics:
    platform: "Performance API (browser-native)"
    rationale: "FPS monitoring, render timing, and memory usage via browser Performance API"

  tracing:
    platform: "none"
    rationale: "No distributed tracing needed for client-only app"

  errors:
    platform: "window.onerror + Error Boundary"
    rationale: "React Error Boundaries catch component errors; global handler for unhandled exceptions"

# =============================================================================
# DEVELOPMENT TOOLS
# =============================================================================
development:
  ide:
    primary: "VS Code / Cursor"

  local:
    dev_server: "Vite dev server"
    hot_reload: true
    rationale: "Vite provides instant HMR; no Docker needed for local development"

  docs:
    api: "TypeDoc (auto-generated from TSDoc comments)"

# =============================================================================
# COMPONENT-TO-TECHNOLOGY MAPPING
# =============================================================================
component_mapping:
  viewport_3d:
    notional: "3D Viewport"
    technology: "React + @react-three/fiber + Three.js"

  ui_panels:
    notional: "UI Panels (Toolbar, Palette, Properties)"
    technology: "React + Tailwind CSS"

  ghost_brick:
    notional: "Ghost Brick Overlay"
    technology: "@react-three/fiber (transparent mesh)"

  scene_manager:
    notional: "Scene Manager"
    technology: "React hooks + @react-three/fiber scene graph"

  brick_placement:
    notional: "Brick Placement Engine"
    technology: "Three.js Raycaster + three-mesh-bvh + custom occupancy map"

  selection_transform:
    notional: "Selection & Transform"
    technology: "Three.js Raycaster + @react-three/drei helpers"

  command_system:
    notional: "Command System"
    technology: "TypeScript command pattern + Zustand middleware"

  camera_controller:
    notional: "Camera Controller"
    technology: "@react-three/drei OrbitControls"

  state_store:
    notional: "State Store"
    technology: "Zustand + Immer middleware"

  brick_catalog:
    notional: "Brick Catalog"
    technology: "TypeScript constants + Three.js BoxGeometry"

  persistence_manager:
    notional: "Persistence Manager"
    technology: "idb (IndexedDB wrapper)"

  export_import:
    notional: "Export/Import Engine"
    technology: "Native File API + JSON serialization + html2canvas/Three.js renderer.domElement.toDataURL"

  performance_optimizer:
    notional: "Performance Optimizer"
    technology: "Three.js InstancedMesh + three-mesh-bvh + custom 3D occupancy grid"

# =============================================================================
# TECH PACK REFERENCE
# =============================================================================
# No pre-built tech packs match this stack exactly.
# Custom scaffolding based on React + Vite + Three.js.
tech_packs:
  - name: "custom-react-vite-threejs"
    path: "custom"
    description: "Custom scaffold for React 18 + Vite + Three.js (@react-three/fiber) SPA"
